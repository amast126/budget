name: Update weekly recipes

on:
  schedule:
    - cron: "23 11 * * 6"     # Saturdays about 7:20am New York time, before a weekend shop
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/fetch-recipes.mjs", "src/ingredients.mjs", ".github/workflows/recipes.yml"]

permissions:
  contents: write             # lets the job commit recipes.json

concurrency:
  group: dashboard-recipes
  cancel-in-progress: false

jobs:
  recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch recipes
        run: node scripts/fetch-recipes.mjs
      - name: Commit recipes.json if it changed
        run: |
          git config user.name "recipes-bot"
          git config user.email "recipes-bot@users.noreply.github.com"
          git add recipes.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "recipes: week $(date -u +'%G-W%V')"
            git pull --rebase origin main
            git push
          fi
