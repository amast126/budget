name: Update dashboard news

on:
  schedule:
    - cron: "7,37 * * * *"   # about every 30 minutes (GitHub can delay scheduled runs a few minutes)
  workflow_dispatch:          # run it by hand from the Actions tab

permissions:
  contents: write             # lets the job commit news.json

concurrency:
  group: dashboard-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch news
        run: node scripts/fetch-news.mjs
      - name: Commit news.json if it changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "news: update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push
          fi
