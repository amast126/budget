<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard</title>
  <meta name="theme-color" content="#F5F6F2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <style>html,body{margin:0;background:#F5F6F2}#root:empty::before{content:"Loading…";display:block;padding:24px;font:14px system-ui;color:#5F6B64}
  html.theme-glass{background:#28476f}html.theme-glass.dark{background:#0a1220}html.theme-glass body{background:transparent}html.theme-glass #root:empty::before{color:#fff}</style>
  <script>
    // Pick the look before anything paints (the app keeps it up to date from here): Liquid Glass unless you chose Classic.
    // As a Home Screen app, glass also lets the sky run up behind the status bar.
    try { if (localStorage.getItem('dash.theme') !== 'classic') { document.documentElement.className = 'theme-glass' + (matchMedia('(prefers-color-scheme: dark)').matches ? ' dark' : ''); document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'black-translucent'); } } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- Deploy routine: bump the v= numbers below whenever that file changes, so phones fetch the new copy. -->
  <script>window.__BUILD = 'v31';</script>
  <script src="config.js?v=10"></script>
  <script src="dashboard.js?v=31"></script>
</body>
</html>
